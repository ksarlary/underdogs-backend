spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://keycloak:8080/realms/underdogs}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/underdogs/protocol/openid-connect/certs}

# CORS and Security for production
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ton-domaine-frontend.com}

server:
  port: 8080
  forward-headers-strategy: native

# Secured Monitoring (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: underdogs-backend