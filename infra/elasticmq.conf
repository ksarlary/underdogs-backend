include classpath("application.conf")

# Les URL de file renvoyées aux clients doivent utiliser le nom de service
# Docker, sinon le worker recevrait des URL en localhost inexploitables.
node-address {
    protocol = http
    host = sqs
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
}

queues {
    underdogs-requests-queue {
        deadLettersQueue {
            name = "underdogs-dead-letters-queue"
            maxReceiveCount = 5
        }
    }
    underdogs-responses-queue {}
    underdogs-dead-letters-queue {}
}
