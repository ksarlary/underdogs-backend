apiVersion: apps/v1
kind: Deployment
metadata:
  name: underdogs-backend
spec:
  replicas: 1 # Tu pourras augmenter si tu gères le verrouillage de tes tâches planifiées (ShedLock)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ton-registry/underdogs_api:1.0-SNAPSHOT # Remplace par ton image Docker poussée sur un registry (Docker Hub, ECR, etc.)
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: underdogs-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: underdogs-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: underdogs-secrets
                  key: DB_PASSWORD
          # Sondes Kubernetes pour s'assurer que le backend est prêt et en vie
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: LoadBalancer # Ou NodePort / Ingress selon ton infra cloud
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080